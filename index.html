    }).addTo(map);

        return function(e) {
            e.stopPropagation();
            window.open(googleLink, '_blank');
        };
    }
    function getInstagramIconLink(url) {
    return `

            <svg viewBox="0 0 24 24" class="ig-icon">

                3v10c0 1.7-1.3 3-3 3H7c-1.7 0-3-1.3-3-3V7c0-1.7 
                1.3-3 3-3h10zm-5 3.5A4.5 4.5 0 1 0 16.5 12 
                4.5 4.5 0 0 0 12 7.5zm0 7A2.5 2.5 0 1 1 
                14.5 12 2.5 2.5 0 0 1 12 14.5zm4.8-7.8a1 1 0 1 
                0 1-1 1 1 0 0 0-1 1z"/>
            </svg>
        </a>
    `;
    }
    function getFacebookIconLink(url) {
        return `
            <a href="${url}" target="_blank" class="fb-link">
                <svg viewBox="0 0 24 24" class="fb-icon">
                    <path d="M22 12a10 10 0 1 0-11.5 9.9v-7h-2.3v-2.9h2.3V9.8

        let popupContent = `<strong>${loc.name}</strong>`;

        }
if(loc.worktime && loc.worktime.length>0){

if (loc.website && loc.website.length > 0) {

    if (loc.website.includes("facebook.com")) {

    }
    else if (loc.website.includes("instagram.com")) {
    popupContent += `<div class="popup-web">${getInstagramIconLink(loc.website)}</div>`;
    }
    else {
    popupContent += `

                ${loc.website.replace(/^https?:\/\//,'')}
            </a>
        </div>
    `;
}

}        popupContent += `<p>${loc.description}</p>`;

        const marker = L.marker([loc.lat, loc.lng]);
        marker.locationData = loc; 

        marker.bindPopup(popupContent, { autoPan: true });

        marker.on('popupopen', function() {
            const popupNode = this.getPopup().getElement();
            if (!popupNode) return;
            const img = popupNode.querySelector('.location-image');
            if (img) {
                img.removeEventListener('click', img._clickHandler);
                const handler = onImageClick(loc.googleMaps);
                img._clickHandler = handler;
                img.addEventListener('click', handler);
                img.style.cursor = 'pointer';
            }
            const placeholderDiv = popupNode.querySelector('.location-image[data-googlemap]');
            if (placeholderDiv && placeholderDiv.tagName === 'DIV') {
                placeholderDiv.removeEventListener('click', placeholderDiv._clickHandler);
                const divHandler = function() { window.open(loc.googleMaps, '_blank'); };
                placeholderDiv._clickHandler = divHandler;
                placeholderDiv.addEventListener('click', divHandler);
            }
        });

        markers.push(marker);
        cluster.addLayer(marker);
    });

    map.addLayer(cluster);

const findButton = document.getElementById("findNearest");
if (findButton) {
    console.log("Find button found"); // For debugging
    
    findButton.addEventListener("click", (e) => {
        console.log("Button clicked"); // For debugging
        
        if (!navigator.geolocation) {
            alert("Geolocation не се поддържа от браузъра.");
            return;
        }

        findButton.textContent = "Търсене...";
        findButton.disabled = true;

        navigator.geolocation.getCurrentPosition(
            (position) => {
                console.log("Position obtained:", position); 
                
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;

                let closestMarker = null;
                let shortestDistance = Infinity;

                markers.forEach(marker => {
                    const markerLatLng = marker.getLatLng();
                    const distance = map.distance(
                        [userLat, userLng],
                        [markerLatLng.lat, markerLatLng.lng]
                    );
                    if (distance < shortestDistance) {
                        shortestDistance = distance;
                        closestMarker = marker;
                    }
                });

                if (closestMarker) {
                    map.setView(closestMarker.getLatLng(), 15);
                    
                    setTimeout(() => {
                        try {
                            closestMarker.openPopup();
                        } catch (e) {
                            console.error("Error opening popup:", e);
                            cluster.zoomToShowLayer(closestMarker, () => {
                                setTimeout(() => {
                                    closestMarker.openPopup();
                                }, 200);
                            });
                        }
                    }, 300);
                } else {
                    alert("Няма намерени обекти.");
                }
                
                // Reset button
                findButton.textContent = "Намери ми Стълбата";
                findButton.disabled = false;
            },
            (error) => {
                console.error("Geolocation error:", error);
                let errorMessage = "Не може да се вземе местоположение.";
                
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        errorMessage = "Разрешението за местоположение е отказано. Моля, разрешете достъп в браузъра си.";
                        break;
                    case error.POSITION_UNAVAILABLE:
                        errorMessage = "Информацията за местоположение е недостъпна.";
                        break;
                    case error.TIMEOUT:
                        errorMessage = "Времето за изчакване на местоположението изтече.";
                        break;
                }
                
                alert(errorMessage);
                
                findButton.textContent = "Намери ми Стълбата";
                findButton.disabled = false;
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    });
} else {
    console.error("Find button not found in DOM");
}

const style = document.createElement('style');
style.textContent = `
    #findNearest {
        z-index: 1000 !important;
        pointer-events: auto !important;
        opacity: 1 !important;
        visibility: visible !important;
    }
`;
document.head.appendChild(style);

})();
</script>
</body>
</html>
